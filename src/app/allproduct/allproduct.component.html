<section class="background-radial-gradient overflow-hidden d-flex justify-content-center" style="height: 100vh;">

    <div class="container mt-5 overflow-auto" style="height: 90%;">
        <div class="row header-row mt-2">
            <div class="row mt-2">
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="productCodeHeader"
                        style="border: 2px solid white;" value="รหัสสินค้า">
                </div>
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="productNameHeader"
                        style="border: 2px solid white;" value="ชื่อสินค้า">
                </div>
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="quantityHeader" value="จำนวน"
                        style="border: 2px solid white;">
                </div>
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="costPriceHeader"
                        style="border: 2px solid white;" value="ราคาต้นทุน">
                </div>
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="salePriceHeader"
                        style="border: 2px solid white;" value="ราคาขายส่ง">
                </div>
                <div class="col-sm-2">
                    <input type="text" readonly class="form-control text-center" id="salePriceHeader"
                        style="border: 2px solid white;" value="ราคาขายปลีก">
                </div>
            </div>
        </div>
        <div class="row mt-5 " style="max-height:65%;">
            <div *ngFor="let product of products" class="row mt-1">
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly
                        class="form-control text-center" [id]="'productCode' + product.id" [value]="product.id">
                </div>
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly class="form-control"
                        [id]="'productName' + product.id" [value]="product.name">
                </div>
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly
                        class="form-control text-center" [id]="'quantity' + product.id" [value]="product.stock">
                </div>
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly
                        class="form-control text-center" [id]="'costPriceHeader' + product.id"
                        [value]="product.costPriceHeader">
                </div>
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly
                        class="form-control text-center" [id]="'salePrice' + product.id"
                        [value]="product.wholesalePrice">
                </div>
                <div class="col-sm-2">
                    <input [ngClass]="{'red-background': product.stock < 11}" type="text" readonly
                        class="form-control text-center" [id]="'salePrice' + product.id" [value]="product.retailPrice">
                </div>
            </div>
        </div>


    </div>


    <div class="row mt-2">
        <div class="col-sm-1">
            <img src="assets/img/icons8-back-arrow-50.png" alt="Back" class="input-icon" (click)="goToBackmenu()">
        </div>
    </div>


</section>
